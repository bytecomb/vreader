name: Build unsigned IPA

# Manual trigger only. Never runs on push/PR/schedule.
on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-15 # arm64 (M1); free on public repos. Xcode 16.4 is the image default.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Build app without code signing
        run: |
          set -euo pipefail
          xcodebuild build \
            -project vreader.xcodeproj \
            -scheme vreader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation

      - name: Package .app into unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry vreader-unsigned.ipa Payload
          ls -lh vreader-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: vreader-unsigned-ipa
          path: vreader-unsigned.ipa
          retention-days: 14
